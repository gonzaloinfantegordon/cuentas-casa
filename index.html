<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cuentas de Casa</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="theme-color" content="#eef2ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d5c45'/%3E%3Cpath d='M16 34 32 18l16 16v14H16z' fill='%23eef2ef'/%3E%3Crect x='28' y='36' width='8' height='12' fill='%230d5c45'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d5c45'/%3E%3Cpath d='M16 34 32 18l16 16v14H16z' fill='%23eef2ef'/%3E%3Crect x='28' y='36' width='8' height='12' fill='%230d5c45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: libro de cuentas de bolsillo — una columna en móvil, dos en escritorio; cifras en columnas tabulares */
:root{
  --bg:#eef2ef; --surface:#ffffff; --sunk:#e3e9e5; --line:#d3dcd6;
  --ink:#13211c; --muted:#5d6e66;
  --accent:#0d5c45; --accent-ink:#ffffff; --accent-soft:#d6e9e1;
  --gasto:#b0412b; --gasto-soft:#f6dfd8;
  --ahorro:#2f6fa8; --ahorro-soft:#dce8f4;
  --inv:#6b4bb0; --inv-soft:#e7e0f5;
  --warn:#9a6a00; --warn-soft:#f6ecd0;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --c1:#2f6fa8; --c2:#c46a2a; --c3:#3d8b5e; --c4:#8a5bb5; --c5:#b8475f; --c6:#9a8420; --c7:#9fb0a8;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2a3a33;
  --ink:#e6eee9; --muted:#93a59c;
  --accent:#4fbf96; --accent-ink:#06261b; --accent-soft:#173a2e;
  --gasto:#ec8a72; --gasto-soft:#3a201a;
  --ahorro:#7fb3e6; --ahorro-soft:#172b3d;
  --inv:#b49ae8; --inv-soft:#2a2240;
  --warn:#e5b54a; --warn-soft:#352a10;
  --c1:#7fb3e6; --c2:#eb9a5e; --c3:#6fc493; --c4:#b79ae6; --c5:#ec8aa0; --c6:#d6c25a; --c7:#55665e;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --sunk:#1c2924; --line:#2a3a33;
  --ink:#e6eee9; --muted:#93a59c;
  --accent:#4fbf96; --accent-ink:#06261b; --accent-soft:#173a2e;
  --gasto:#ec8a72; --gasto-soft:#3a201a;
  --ahorro:#7fb3e6; --ahorro-soft:#172b3d;
  --inv:#b49ae8; --inv-soft:#2a2240;
  --warn:#e5b54a; --warn-soft:#352a10;
  --c1:#7fb3e6; --c2:#eb9a5e; --c3:#6fc493; --c4:#b79ae6; --c5:#ec8aa0; --c6:#d6c25a; --c7:#55665e;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1040px;margin:0 auto;height:100%}
#app{display:flex;flex-direction:column;height:100%}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding-bottom:110px;margin-inline:-4px;padding-inline:4px}
#view::-webkit-scrollbar{width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
small{font-size:.8rem}

/* Cabecera */
header.top{flex:none;position:relative;z-index:5;background:var(--bg);padding-block:12px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:420px){.brand{font-size:1.05rem!important}.month span{min-width:104px;font-size:.9rem}.month button{width:30px;height:30px}}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 5px 4px;background:var(--bg);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.month button:hover{background:var(--sunk);color:var(--ink)}
.month span{min-width:118px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%;border-bottom:1px solid var(--line);margin-top:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

/* Bloques */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media(min-width:860px){.grid.two{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Reparto */
.reparto{background:var(--accent);color:var(--accent-ink);border:0}
.reparto .eyebrow{color:inherit;opacity:.8}
.reparto .big{font-family:var(--f-num);font-size:clamp(2rem,7vw,2.8rem);font-weight:500;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.reparto p{margin:0;opacity:.9}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.split>div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.split b{font-family:var(--f-num);font-size:clamp(1rem,4.6vw,1.25rem);font-weight:500;overflow-wrap:anywhere}
.split button{white-space:nowrap;max-width:100%}
.split button{align-self:flex-start;border:1px solid color-mix(in srgb,var(--accent-ink) 45%,transparent);background:none;color:inherit;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.82rem}
.split button:hover{background:color-mix(in srgb,var(--accent-ink) 15%,transparent)}
.bar-split{height:6px;border-radius:6px;background:color-mix(in srgb,var(--accent-ink) 20%,transparent);margin-top:12px;overflow:hidden;display:flex}
.bar-split i{display:block;height:100%}

/* Libro: filas etiqueta/cifra */
.ledger{display:flex;flex-direction:column}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ledger .row:last-child{border-bottom:0}
.ledger .row.total{border-top:1.5px solid var(--ink);border-bottom:0;margin-top:2px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}
.pos{color:var(--accent)} .neg{color:var(--gasto)}

/* Barras de categoría */
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.cat .track{grid-column:1/-1;height:7px;background:var(--sunk);border-radius:7px;overflow:hidden;position:relative}
.cat .track i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--gasto)}
.cat .track i.fijo{background:var(--muted)}
.cat .track i.over{background:var(--warn)}
.cat .lbl{min-width:0;overflow-wrap:anywhere}

/* Progreso colchón */
.meter{height:10px;background:var(--sunk);border-radius:10px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--ahorro);border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--gasto-soft);color:var(--gasto)}
.pill.info{background:var(--ahorro-soft);color:var(--ahorro)}

/* Aviso */
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin-top:16px}
.notice b{color:var(--warn)}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--gasto);border-color:color-mix(in srgb,var(--gasto) 40%,var(--line))}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;height:54px;padding:0 22px 0 18px;font-weight:600;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab span{font-size:1.5rem;line-height:1;margin-top:-2px}

/* Lista de movimientos */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column}
.day{font-size:.78rem;color:var(--muted);font-weight:600;padding:14px 0 4px}
.item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.item:hover{background:var(--sunk)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-size:1.05rem}
.item .t{min-width:0}
.item .t div{overflow-wrap:anywhere}
.item .t small{display:block;overflow-wrap:anywhere}
.item .t small{color:var(--muted)}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.gasto{color:var(--ink)} .amt.ingreso{color:var(--accent)} .amt.ahorro{color:var(--ahorro)} .amt.inversion{color:var(--inv)} .amt.retirada{color:var(--warn)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* Tablas (fijos, posiciones) */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px dashed var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .r{text-align:right}
.tbl tr.off td{opacity:.5}
.tbl .num{white-space:nowrap}
.ledger .num{white-space:nowrap}
@media(max-width:520px){.tbl .hide-sm{display:none}.tbl td,.tbl th{padding-inline:5px}}
.scroll{overflow-x:auto}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}

/* Formulario / hoja */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;margin:auto}
dialog::backdrop{background:rgba(10,20,16,.45)}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 40px);overflow:auto;padding:18px}
@media(max-width:560px){dialog{margin:auto 0 0;width:100vw}.sheet{width:100vw;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
.sheet h3{font-size:1.15rem;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0;max-width:100%;font-size:16px}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
.field{min-width:0}
.field input.amount{font-family:var(--f-num);font-size:1.6rem;padding:8px 12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;cursor:pointer;font-size:.88rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;line-height:1.15}
.catgrid button span{font-size:1.2rem}
.catgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .left{margin-right:auto}
.confirm{background:var(--gasto-soft);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--gasto);font-size:.88rem}
.check{display:flex;align-items:center;gap:8px}

/* Acceso */
.login{max-width:380px;margin:0 auto;height:100%;overflow-y:auto;padding-block:12vh 40px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:2rem}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.code{font-family:var(--f-num);background:var(--sunk);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:.82rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.code span{min-width:0}
.code .btn{flex-shrink:0}

/* Móvil: pestañas abajo, como una app */
nav.tabs .ti{display:none;width:22px;height:22px}
@media(max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;width:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;overflow:visible;
    background:var(--surface);border-top:1px solid var(--line);border-bottom:0;
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;margin:0;border:0;font-size:10.5px;font-weight:600;min-width:0}
  nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs .ti{display:block}
  nav.tabs button[aria-selected="true"]{color:var(--accent)}
  header.top{padding-bottom:4px}
  #view{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
}
.field input,.field select{min-height:46px}
.datebox{overflow:hidden;border-radius:10px;min-width:0}
.field input[type=date]{width:100%;height:46px;line-height:24px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-calendar-picker-indicator{margin:0}

.gear{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.gear[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:860px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-num);font-weight:500;font-size:clamp(1.05rem,4.6vw,1.2rem);white-space:nowrap}
.kpi b.txt{font-family:var(--f-display);font-weight:700;white-space:normal;overflow-wrap:anywhere}
.kpi small{color:var(--muted)}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:.84rem}
.heat th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:2px 4px;text-align:right;white-space:nowrap}
.heat th:first-child{text-align:left}
.heat td{padding:6px 6px;border-radius:6px;text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.heat td.c{font-family:var(--f-body);text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:120px;max-width:150px;white-space:normal;overflow-wrap:anywhere}
.heat td.top{font-weight:600;outline:1.5px solid var(--gasto);outline-offset:-1.5px}
.heat td.avg{color:var(--muted)}
.heat tr.click{cursor:pointer}
.heat tr.sel td.c{color:var(--accent);font-weight:600}
.delta{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline}
.delta .up{color:var(--gasto)} .delta .down{color:var(--accent)}
.delta>span{padding:7px 0;border-bottom:1px dashed var(--line)}
.delta>span.l{min-width:0;overflow-wrap:anywhere}

.search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.search .grow{grid-column:1/-1}
@media(min-width:620px){.search{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}.search .grow{grid-column:auto}}
.sres{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--sunk);border-radius:10px}
.month-h{text-transform:none;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}

/* Controles iguales en todos los navegadores (Safari pinta los select a su manera) */
.field select{-webkit-appearance:none;appearance:none;height:46px;padding-right:36px;line-height:1.2;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.field input{height:46px}
.field input[type=search]{-webkit-appearance:none;appearance:none}
.field input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
.field input.amount{height:auto}
.field input[type=checkbox],.check input{height:auto;width:auto}
.field select:focus-visible,.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg.cinco{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.cinco button{font-size:.8rem;padding:7px 1px}
.loading{opacity:.55;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="login" class="login" hidden>
  <div class="brand"><i></i>Cuentas de Casa</div>
  <h1>Las cuentas de casa, en un sitio.</h1>
  <p class="muted">Introduce el código de acceso de casa. Se queda guardado en este dispositivo.</p>
  <form id="loginForm" class="form">
    <div class="field"><label for="code">Código de acceso</label><input id="code" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="casa-…" required></div>
    <div class="field"><label for="who">¿Quién eres?</label><input id="who" placeholder="Tu nombre" autocomplete="given-name"></div>
    <div id="loginErr" class="err" hidden></div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><i></i>Cuentas de Casa</div>
    <div class="month" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button><span id="mLabel"></span><button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
    <button id="gearBtn" class="gear" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="resumen" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Resumen</span></button>
      <button role="tab" data-tab="movs"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6" fill="currentColor"/><circle cx="4" cy="12" r=".6" fill="currentColor"/><circle cx="4" cy="18" r=".6" fill="currentColor"/></svg><span>Movimientos</span></button>
      <button role="tab" data-tab="stats"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Estadísticas</span></button>
      <button role="tab" data-tab="fijos"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Fijos</span></button>
      <button role="tab" data-tab="patri"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Patrimonio</span></button>
    </nav>
  </header>
  <main id="view"></main>
</div>
</div>

<button class="fab" id="fab" hidden><span>+</span>Apuntar</button>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const VERSION = '2026-10-19-2';
const API = 'https://cugoclgilmlicktkyuxz.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_hsz7J1oo_R03IVyyRS74uA_pJG49kbe';

const store = {
  get(k){ try{ return localStorage.getItem('cc_'+k) }catch(e){ return null } },
  set(k,v){ try{ v==null ? localStorage.removeItem('cc_'+k) : localStorage.setItem('cc_'+k,v) }catch(e){} }
};
let TOKEN = store.get('token');
let WHO = store.get('who') || '';
let tab = store.get('tab') || 'resumen';
let mes = ymNow();
let D = null;            // datos cargados
let movFilter = 'todos';

/* ---------- utilidades ---------- */
function ymNow(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0') }
function ymAdd(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+String(m).padStart(2,'0') }
function ymRange(ym){ const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); return [ym+'-01', ym+'-'+String(last).padStart(2,'0')] }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
const fmtMes = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}) };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmtMesCorto = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'short'}).replace('.','') };
const mkNf = o => { try{ return new Intl.NumberFormat('es-ES',{...o,useGrouping:'always'}) }catch(e){ return new Intl.NumberFormat('de-DE',o) } };
const nf = mkNf({minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = mkNf({maximumFractionDigits:0});
const eur = (n,dec=true) => (dec?nf:nf0).format(Math.round((+n||0)*100)/100)+' €';
const sgn = n => (n>0?'+':n<0?'−':'')+eur(Math.abs(n));
const pct = n => (isFinite(n)? (n*100).toLocaleString('es-ES',{maximumFractionDigits:1}) : '0')+' %';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum = s => { if(typeof s==='number') return s; s=String(s||'').replace(/[€\s]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?n:NaN };
const $ = s => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600) }

async function rpc(fn,args={}){
  const r = await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:TOKEN,...args})});
  const txt = await r.text(); let j; try{ j=JSON.parse(txt) }catch(e){ j=txt }
  if(!r.ok){ const e=new Error((j&&j.message)||txt||'Error'); e.code=j&&j.code; throw e }
  return j;
}

/* ---------- carga ---------- */
async function load(){
  const [desde,hasta]=ymRange(mes);
  $('#view').classList.add('loading');
  try{
    D = await rpc('datos',{p_desde:desde,p_hasta:hasta});
    D.catById = Object.fromEntries(D.categorias.map(c=>[c.id,c]));
    D.posById = Object.fromEntries(D.posiciones.map(p=>[p.id,p]));
    S = null; Q.key='';
    render();
    if(abrirApuntar){ abrirApuntar=false; nuevo('gasto') }
  }catch(e){
    if(e.code==='28000'){ logout('El código de acceso no es correcto.'); return }
    $('#view').innerHTML = `<div class="panel" style="margin-top:16px"><h2>No se han podido cargar los datos</h2><p class="muted">${esc(e.message)}. Comprueba la conexión y vuelve a intentarlo.</p><button class="btn" onclick="load()">Reintentar</button></div>`;
  }finally{ $('#view').classList.remove('loading') }
}

/* ---------- cálculos ---------- */
function fijoAplica(f,ym){ const m=+ym.split('-')[1]; return ((m - f.mes_inicio + 12) % f.cada_meses)===0 }
function calc(){
  const M = D.movimientos;
  const sum = (fn)=>M.filter(fn).reduce((a,m)=>a+ +m.importe,0);
  const ingresos = sum(m=>m.tipo==='ingreso');
  const gFijos = sum(m=>m.tipo==='gasto' && m.fijo);
  const gVar = sum(m=>m.tipo==='gasto' && !m.fijo);
  const ahorro = sum(m=>m.tipo==='ahorro');
  const inversion = sum(m=>m.tipo==='inversion');
  const retirada = sum(m=>m.tipo==='retirada');
  const gastos = gFijos+gVar;
  const sobrante = ingresos-gastos;
  const porAsignar = sobrante-ahorro-inversion+retirada;
  const pA = (+D.ajustes.pct_ahorro)/100;

  // plan mensual con los fijos (equivalente mensual)
  const fAct = D.fijos.filter(f=>f.activo);
  const planIng = fAct.filter(f=>f.tipo==='ingreso').reduce((a,f)=>a+f.importe/f.cada_meses,0);
  const planFijos = fAct.filter(f=>f.tipo==='gasto').reduce((a,f)=>a+f.importe/f.cada_meses,0);
  // variables: media de los últimos 3 meses cerrados con datos (si no, presupuesto)
  const hist = D.historico.filter(h=>h.mes<ymNow()).slice(-3);
  const presVar = D.categorias.filter(c=>c.tipo==='gasto'&&c.naturaleza==='variable'&&c.activa&&c.presupuesto).reduce((a,c)=>a+ +c.presupuesto,0);
  const mediaVar = hist.length ? hist.reduce((a,h)=>a+ +h.gastos_variables,0)/hist.length : 0;
  const planVar = presVar || mediaVar;
  const planVarFuente = presVar ? 'presupuestos' : (hist.length ? `media de ${hist.length} mes${hist.length>1?'es':''}` : 'sin datos aún');
  const capacidad = planIng-planFijos-planVar;

  // colchón
  const gastoMensual = planFijos + (planVar || gVar);
  const objetivo = gastoMensual * (+D.ajustes.colchon_meses);
  const liquidez = D.posiciones.filter(p=>p.activa&&p.tipo==='liquidez').reduce((a,p)=>a+ +p.valor_actual,0);

  // fijos pendientes de registrar este mes
  const hechos = new Set(M.filter(m=>m.fijo_id && m.periodo===mes).map(m=>m.fijo_id));
  const pendientes = fAct.filter(f=>f.importe>0 && fijoAplica(f,mes) && !hechos.has(f.id));

  // por categoría
  const porCat = {};
  M.filter(m=>m.tipo==='gasto').forEach(m=>{ const k=m.categoria_id||'_'; porCat[k]=(porCat[k]||0)+ +m.importe });

  return {ingresos,gFijos,gVar,gastos,ahorro,inversion,retirada,sobrante,porAsignar,pA,
    sugAhorro: Math.max(0,porAsignar)*pA, sugInv: Math.max(0,porAsignar)*(1-pA),
    planIng,planFijos,planVar,planVarFuente,capacidad,gastoMensual,objetivo,liquidez,pendientes,porCat};
}

/* ---------- render ---------- */
function render(){
  $('#mLabel').textContent = cap(fmtMes(mes));
  $('#nextM').disabled = mes >= ymAdd(ymNow(),1);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  const v = $('#view');
  if(!D) return;
  if(tab==='resumen') v.innerHTML = vResumen();
  if(tab==='movs'){ v.innerHTML = vMovs(); movsBind(); movsRefresh() }
  if(tab==='fijos') v.innerHTML = vFijos();
  if(tab==='patri') v.innerHTML = vPatri();
  if(tab==='ajustes') v.innerHTML = vAjustes();
  if(tab==='stats') renderStats();
  $('#gearBtn').setAttribute('aria-pressed', tab==='ajustes');
}

function vResumen(){
  const c = calc();
  const esActual = mes===ymNow();
  const pAh = Math.round(c.pA*100);
  const colPct = c.objetivo>0 ? Math.min(1,c.liquidez/c.objetivo) : 0;
  const colEstado = c.objetivo<=0 ? '<span class="pill info">Añade tus fijos para calcularlo</span>'
    : colPct>=1 ? '<span class="pill ok">Completo</span>'
    : colPct>=.5 ? '<span class="pill warn">'+pct(colPct)+'</span>' : '<span class="pill bad">'+pct(colPct)+'</span>';

  let hero;
  if(c.ingresos===0 && c.gastos===0){
    hero = `<p>Aún no hay movimientos en ${esc(fmtMes(mes))}. Apunta la nómina y los gastos, o registra los fijos del mes, y aquí verás cuánto podéis repartir entre ahorro e inversión.</p>`;
  } else if(c.porAsignar<=0){
    hero = `<p>${c.porAsignar<0 ? 'Este mes los gastos superan a lo que ha entrado en '+eur(-c.porAsignar)+'. Si lo habéis cubierto con ahorros, apuntadlo como retirada.' : 'Todo lo que sobraba ya está repartido.'}</p>${c.porAsignar<0?`<div class="split" style="grid-template-columns:1fr"><div><button onclick="nuevo('retirada',${(-c.porAsignar).toFixed(2)})">Apuntar retirada de ahorros</button></div></div>`:''}`;
  } else {
    hero = `<p>Os quedan sin repartir de lo que ha sobrado este mes.</p>
      <div class="split">
        <div><span class="eyebrow">A ahorro · ${pAh} %</span><b>${eur(c.sugAhorro)}</b><button onclick="nuevo('ahorro',${c.sugAhorro.toFixed(2)})">Mover a ahorro</button></div>
        <div><span class="eyebrow">A inversión · ${100-pAh} %</span><b>${eur(c.sugInv)}</b><button onclick="nuevo('inversion',${c.sugInv.toFixed(2)})">Mover a inversión</button></div>
      </div>
      <div class="bar-split" aria-hidden="true"><i style="width:${pAh}%;background:var(--accent-ink);opacity:.85"></i><i style="width:${100-pAh}%;background:var(--accent-ink);opacity:.35"></i></div>`;
  }

  const pend = c.pendientes.length ? `<div class="notice"><span><b>${c.pendientes.length} fijo${c.pendientes.length>1?'s':''}</b> de ${esc(fmtMes(mes))} sin registrar (${[['gasto','en gastos'],['ingreso','en ingresos']].map(([t,l])=>{const v=c.pendientes.filter(f=>f.tipo===t).reduce((a,f)=>a+ +f.importe,0);return v?eur(v)+' '+l:''}).filter(Boolean).join(' y ')}).</span><button class="btn small" onclick="registrarFijos()">Registrar ahora</button></div>` : '';

  // categorías
  const cats = Object.entries(c.porCat).map(([id,v])=>({c:D.catById[id]||{nombre:'Sin categoría',icono:'•',naturaleza:'variable'},v})).sort((a,b)=>b.v-a.v);
  const maxCat = Math.max(1,...cats.map(x=>Math.max(x.v,+x.c.presupuesto||0)));
  const catsHtml = cats.length ? cats.map(({c:k,v})=>{
    const pres=+k.presupuesto||0; const over = pres && v>pres;
    return `<div class="cat"><span class="lbl">${esc(k.icono)} ${esc(k.nombre)} ${k.naturaleza==='fijo'?'<small class="muted">· fijo</small>':''}</span>
      <span class="num">${eur(v)}${pres?` <small class="muted">/ ${eur(pres,false)}</small>`:''}</span>
      <span class="track"><i class="${over?'over':k.naturaleza==='fijo'?'fijo':''}" style="width:${(v/maxCat*100).toFixed(1)}%"></i>${pres?`<span style="position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:${(pres/maxCat*100).toFixed(1)}%"></span>`:''}</span></div>`}).join('')
    : '<div class="empty">Sin gastos este mes.</div>';

  return `${pend}
  <div class="grid two">
    <div class="stack">
      <section class="panel reparto">
        <span class="eyebrow">Por repartir · ${esc(fmtMes(mes))}</span>
        <div class="big">${eur(Math.max(0,c.porAsignar))}</div>
        ${hero}
      </section>
      <section class="panel">
        <header><h2>Cuenta del mes</h2><span class="muted"><small>${esActual?'hasta hoy':'mes cerrado'}</small></span></header>
        <div class="ledger">
          <div class="row"><span><i class="dot" style="background:var(--accent)"></i>Ingresos</span><span class="num">${eur(c.ingresos)}</span></div>
          <div class="row"><span><i class="dot" style="background:var(--muted)"></i>Gastos fijos</span><span class="num">${c.gFijos?"−":""}${eur(c.gFijos)}</span></div>
          <div class="row"><span><i class="dot" style="background:var(--gasto)"></i>Gastos variables</span><span class="num">${c.gVar?"−":""}${eur(c.gVar)}</span></div>
          <div class="row total"><span>Sobrante</span><span class="num ${c.sobrante>=0?'pos':'neg'}">${sgn(c.sobrante)}</span></div>
          <div class="row"><span><i class="dot" style="background:var(--ahorro)"></i>Ya movido a ahorro</span><span class="num">${eur(c.ahorro)}</span></div>
          <div class="row"><span><i class="dot" style="background:var(--inv)"></i>Ya movido a inversión</span><span class="num">${eur(c.inversion)}</span></div>
          ${c.retirada?`<div class="row"><span><i class="dot" style="background:var(--warn)"></i>Sacado de ahorros</span><span class="num">+${eur(c.retirada)}</span></div>`:''}
          <div class="row total"><span>Por repartir</span><span class="num">${eur(c.porAsignar)}</span></div>
        </div>
      </section>
      <section class="panel">
        <header><h2>Gastos por categoría</h2><span class="muted"><small>la raya marca el presupuesto</small></span></header>
        <div class="cats">${catsHtml}</div>
      </section>
    </div>
    <div class="stack">
      <section class="panel">
        <header><h2>Previsión mensual</h2><small class="muted">con vuestros fijos</small></header>
        <div class="ledger">
          <div class="row"><span>Ingresos fijos</span><span class="num">${eur(c.planIng)}</span></div>
          <div class="row"><span>Gastos fijos</span><span class="num">${c.planFijos?"−":""}${eur(c.planFijos)}</span></div>
          <div class="row"><span>Variables <small class="muted">(${esc(c.planVarFuente)})</small></span><span class="num">${c.planVar?"−":""}${eur(c.planVar)}</span></div>
          <div class="row total"><span>Capacidad de ahorro e inversión</span><span class="num ${c.capacidad>=0?'pos':'neg'}">${sgn(c.capacidad)}</span></div>
        </div>
        ${c.capacidad>0?`<p class="muted" style="margin:10px 0 0"><small>Al mes, unos ${eur(c.capacidad*c.pA,false)} a ahorro y ${eur(c.capacidad*(1-c.pA),false)} a inversión · ${eur(c.capacidad*12,false)} al año.</small></p>`:''}
        ${D.fijos.length===0?`<p style="margin:10px 0 0"><button class="btn small" onclick="setTab('fijos')">Añadir ingresos y gastos fijos</button></p>`:''}
      </section>
      <section class="panel">
        <header><h2>Colchón de liquidez</h2>${colEstado}</header>
        <div class="meter"><i style="width:${(colPct*100).toFixed(1)}%"></i></div>
        <div class="ledger">
          <div class="row"><span>En liquidez</span><span class="num">${eur(c.liquidez)}</span></div>
          <div class="row"><span>Objetivo · ${esc(D.ajustes.colchon_meses)} meses de gastos</span><span class="num">${eur(c.objetivo)}</span></div>
          ${c.objetivo>c.liquidez?`<div class="row"><span>Falta</span><span class="num">${eur(c.objetivo-c.liquidez)}</span></div>`:''}
        </div>
        ${colPct>=1&&c.objetivo>0?'<p class="muted" style="margin:10px 0 0"><small>El colchón está cubierto. Podríais subir la parte que va a inversión en Ajustes.</small></p>':''}
      </section>
      <section class="panel chart">
        <header><h2>Últimos 12 meses</h2></header>
        ${chartHist()}
      </section>
    </div>
  </div>`;
}

function chartHist(){
  const months=[]; for(let i=11;i>=0;i--) months.push(ymAdd(ymNow(),-i));
  const H = Object.fromEntries(D.historico.map(h=>[h.mes,h]));
  const rows = months.map(m=>{ const h=H[m]||{}; return {m, ing:+h.ingresos||0, gas:(+h.gastos_fijos||0)+(+h.gastos_variables||0), ai:(+h.ahorro||0)+(+h.inversion||0)} });
  const max = Math.max(1,...rows.map(r=>Math.max(r.ing,r.gas)));
  if(rows.every(r=>!r.ing&&!r.gas)) return '<div class="empty">El gráfico se irá llenando según apuntéis meses.</div>';
  const W=360,Hh=150,top=10,bot=22,left=30,step=(W-left)/12,bw=step*0.32;
  const y = v => top+(Hh-top-bot)*(1-v/max);
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); const n=[1,2,2.5,5,10].map(k=>k*p).find(k=>k*3>=max)||p*10; return n })();
  let g='';
  for(let k=1;k*nice<=max;k++){ const yy=y(k*nice); g+=`<line x1="${left}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${left-4}" y="${yy+3}" text-anchor="end" font-size="8" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${nf0.format(k*nice)}</text>` }
  rows.forEach((r,i)=>{
    const x=left+i*step+step*0.15;
    g+=`<rect x="${x}" y="${y(r.ing)}" width="${bw}" height="${Math.max(0,y(0)-y(r.ing))}" rx="1.5" fill="var(--accent)"><title>${fmtMes(r.m)} · ingresos ${eur(r.ing)}</title></rect>`;
    g+=`<rect x="${x+bw+1.5}" y="${y(r.gas)}" width="${bw}" height="${Math.max(0,y(0)-y(r.gas))}" rx="1.5" fill="var(--gasto)" opacity=".85"><title>${fmtMes(r.m)} · gastos ${eur(r.gas)}</title></rect>`;
    g+=`<text x="${x+bw}" y="${Hh-8}" text-anchor="middle" font-size="8.5" fill="${r.m===mes?'var(--ink)':'var(--muted)'}" font-weight="${r.m===mes?700:400}">${fmtMesCorto(r.m)}</text>`;
  });
  g+=`<line x1="${left}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Ingresos y gastos de los últimos 12 meses">${g}</svg>
    <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Ingresos</span><span><i class="dot" style="background:var(--gasto)"></i>Gastos</span></div>`;
}


/* ---------- estadísticas ---------- */
let statsN = +(store.get('statsN')||6), S = null, statsKey = '', statsCat = null;
async function renderStats(){
  const v=$('#view'); const key=mes+'|'+statsN;
  if(S && statsKey===key){ v.innerHTML=vStats(); return }
  v.innerHTML = `<div class="panel" style="margin-top:16px"><p class="muted">Calculando estadísticas…</p></div>`;
  try{ S = await rpc('estadisticas',{p_hasta:ymRange(mes)[1],p_meses:statsN}); statsKey=key; if(tab==='stats') v.innerHTML=vStats() }
  catch(e){ v.innerHTML=`<div class="panel" style="margin-top:16px"><p class="err">${esc(e.message)}</p><button class="btn" onclick="S=null;renderStats()">Reintentar</button></div>` }
}
function vStats(){
  const months=[]; for(let i=statsN-1;i>=0;i--) months.push(ymAdd(mes,-i));
  const M = {}; months.forEach(m=>M[m]={total:0,fijo:0,var:0,cats:{}});
  S.cats.forEach(r=>{ const o=M[r.mes]; if(!o) return; const k=r.categoria_id||'_'; o.cats[k]=(o.cats[k]||0)+ +r.total; o.total+= +r.total; if(r.fijo) o.fijo+= +r.total; else o.var+= +r.total });
  const ING={}; S.ingresos.forEach(r=>ING[r.mes]=+r.total);
  const catTot={}; months.forEach(m=>Object.entries(M[m].cats).forEach(([k,v])=>catTot[k]=(catTot[k]||0)+v));
  const cats=Object.keys(catTot).sort((a,b)=>catTot[b]-catTot[a]);
  const catInfo=k=>D.catById[k]||{nombre:'Sin categoría',icono:'•'};
  const conDatos=months.filter(m=>M[m].total>0);
  const chips=[3,6,12].map(n=>`<button class="chip" aria-pressed="${statsN===n}" onclick="statsN=${n};store.set('statsN',${n});renderStats()">${n} meses</button>`).join('');
  const head=`<div class="panel" style="margin-top:16px"><header style="margin-bottom:0"><div><h2>Estadísticas</h2><small class="muted">${esc(cap(fmtMes(months[0])))} – ${esc(fmtMes(mes))}</small></div><div class="filters">${chips}</div></header></div>`;
  if(!conDatos.length) return head+`<div class="panel" style="margin-top:14px"><div class="empty">Todavía no hay gastos en este periodo. Las estadísticas aparecen en cuanto apuntéis el primero.</div></div>`;

  // KPIs
  const media=conDatos.reduce((a,m)=>a+M[m].total,0)/conDatos.length;
  const caro=conDatos.reduce((a,m)=>M[m].total>M[a].total?m:a,conDatos[0]);
  const barato=conDatos.reduce((a,m)=>M[m].total<M[a].total?m:a,conDatos[0]);
  const prev=conDatos.filter(m=>m<mes); const mediaPrev=prev.length?prev.reduce((a,m)=>a+M[m].total,0)/prev.length:0;
  const dAct = mediaPrev? (M[mes].total-mediaPrev)/mediaPrev : null;
  const mesN = m => cap(new Date(+m.slice(0,4), +m.slice(5,7)-1, 1).toLocaleDateString('es-ES',{month:'long'}));
  const uno = conDatos.length<2;
  const kpis=`<div class="kpis" style="margin-top:14px">
    <div class="kpi"><small>Gasto medio al mes</small><b>${eur(media,false)}</b><small>${conDatos.length} mes${conDatos.length>1?'es':''} con datos</small></div>
    <div class="kpi"><small>Mes con más gasto</small><b class="txt">${uno?'—':esc(mesN(caro))}</b><small>${uno?'hace falta más de un mes':caro.slice(0,4)+' · '+eur(M[caro].total,false)}</small></div>
    <div class="kpi"><small>Mes con menos gasto</small><b class="txt">${uno?'—':esc(mesN(barato))}</b><small>${uno?'hace falta más de un mes':barato.slice(0,4)+' · '+eur(M[barato].total,false)}</small></div>
    <div class="kpi"><small>${esc(mesN(mes))} frente a la media</small><b class="${dAct==null?'':dAct>0?'neg':'pos'}">${dAct==null?'—':(dAct>0?'+':'')+pct(dAct)}</b><small>${dAct==null?'sin meses anteriores':eur(M[mes].total,false)+' vs '+eur(mediaPrev,false)}</small></div>
  </div>`;

  // gráfico apilado
  const top=cats.slice(0,6); const color=i=>`var(--c${i+1})`;
  const W=360,H=190,L=34,T=12,B=24, step=(W-L)/months.length, bw=Math.min(28,step*0.62);
  const max=Math.max(1,...months.map(m=>M[m].total));
  const nice=(()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); return [1,2,2.5,5,10].map(k=>k*p).find(k=>k*4>=max)||p*10 })();
  const y=v=>T+(H-T-B)*(1-v/(Math.ceil(max/nice)*nice));
  let g=''; for(let k=0;k*nice<=Math.ceil(max/nice)*nice;k++){ const yy=y(k*nice); g+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${k?'stroke-dasharray="2 3"':''}/><text x="${L-4}" y="${yy+3}" text-anchor="end" font-size="8" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${nf0.format(k*nice)}</text>` }
  months.forEach((m,i)=>{ const x=L+i*step+(step-bw)/2; let acc=0;
    const parts=top.map((k,j)=>[M[m].cats[k]||0,color(j),catInfo(k).nombre]); const resto=M[m].total-parts.reduce((a,p)=>a+p[0],0); parts.push([resto,'var(--c7)','Resto']);
    parts.forEach(([v,c,n])=>{ if(v<=0) return; const y1=y(acc+v), y0=y(acc); g+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-0.6)}" fill="${c}"><title>${esc(fmtMes(m))} · ${esc(n)}: ${eur(v)}</title></rect>`; acc+=v });
    if(M[m].total) g+=`<text x="${x+bw/2}" y="${y(M[m].total)-4}" text-anchor="middle" font-size="7.5" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${nf0.format(M[m].total)}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="${m===mes?'var(--ink)':'var(--muted)'}" font-weight="${m===mes?700:400}">${fmtMesCorto(m)}</text>` });
  const legend=top.map((k,j)=>`<span><i class="dot" style="background:${color(j)}"></i>${esc(catInfo(k).nombre)}</span>`).join('')+(cats.length>6?`<span><i class="dot" style="background:var(--c7)"></i>Resto</span>`:'');
  const chart=`<section class="panel chart"><header><h2>Gasto por mes</h2><small class="muted">por categoría</small></header><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto mensual por categoría">${g}</svg><div class="legend">${legend}</div></section>`;

  // mapa de calor
  const rows=cats.map(k=>{ const vals=months.map(m=>M[m].cats[k]||0); const mx=Math.max(...vals); const n=vals.filter(v=>v>0).length; const avg=catTot[k]/Math.max(1,conDatos.length);
    const c=catInfo(k);
    return `<tr class="click ${statsCat===k?'sel':''}" onclick="statsCat='${k}';$('#view').innerHTML=vStats();document.getElementById('detalle').scrollIntoView({block:'nearest',behavior:'smooth'})"><td class="c">${esc(c.icono)} ${esc(c.nombre)}</td>${vals.map(v=>`<td class="${v&&v===mx&&n>1?'top':''}" style="${v?`background:color-mix(in srgb,var(--gasto) ${Math.round(8+47*v/mx)}%,transparent)`:''}">${v?nf0.format(v):'<span class="muted">·</span>'}</td>`).join('')}<td class="avg">${nf0.format(avg)}</td></tr>` }).join('');
  const totRow=`<tr><td class="c"><b>Total</b></td>${months.map(m=>`<td><b>${M[m].total?nf0.format(M[m].total):'·'}</b></td>`).join('')}<td class="avg"><b>${nf0.format(media)}</b></td></tr>`;
  const heat=`<section class="panel"><header><h2>Qué mes gastáis más en qué</h2><small class="muted">€ · el recuadro marca el mes más alto de cada categoría · toca una fila</small></header>
    <div class="scroll"><table class="heat"><thead><tr><th>Categoría</th>${months.map(m=>`<th>${fmtMesCorto(m)}</th>`).join('')}<th>Media</th></tr></thead><tbody>${rows}${totRow}</tbody></table></div></section>`;

  // detalle categoría
  const sel = statsCat && catTot[statsCat]!=null ? statsCat : cats[0];
  const vals=months.map(m=>M[m].cats[sel]||0); const avgSel=catTot[sel]/Math.max(1,conDatos.length); const mxS=Math.max(1,...vals,avgSel);
  const W2=360,H2=150,L2=34,T2=14,B2=22,st2=(W2-L2)/months.length,bw2=Math.min(26,st2*0.6); const y2=v=>T2+(H2-T2-B2)*(1-v/mxS);
  let g2=`<line x1="${L2}" x2="${W2}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--muted)"/>`;
  months.forEach((m,i)=>{ const x=L2+i*st2+(st2-bw2)/2, v=vals[i]; g2+=`<rect x="${x}" y="${y2(v)}" width="${bw2}" height="${Math.max(0,y2(0)-y2(v))}" rx="2" fill="${m===mes?'var(--gasto)':'var(--c1)'}"><title>${esc(fmtMes(m))}: ${eur(v)}</title></rect>`;
    if(v) g2+=`<text x="${x+bw2/2}" y="${y2(v)-4}" text-anchor="middle" font-size="7.5" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${nf0.format(v)}</text>`;
    g2+=`<text x="${x+bw2/2}" y="${H2-7}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${fmtMesCorto(m)}</text>` });
  g2+=`<line x1="${L2}" x2="${W2}" y1="${y2(avgSel)}" y2="${y2(avgSel)}" stroke="var(--ink)" stroke-dasharray="4 3"/><text x="${L2-4}" y="${y2(avgSel)+3}" text-anchor="end" font-size="8" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${nf0.format(avgSel)}</text>`;
  const ci=catInfo(sel);
  const detalle=`<section class="panel chart" id="detalle"><header><h2>${esc(ci.icono)} ${esc(ci.nombre)}</h2><small class="muted">la línea es la media: ${eur(avgSel,false)}/mes</small></header><svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Gasto mensual en ${esc(ci.nombre)}">${g2}</svg>
    <div class="ledger"><div class="row"><span>Total del periodo</span><span class="num">${eur(catTot[sel])}</span></div><div class="row"><span>Peso sobre el gasto total</span><span class="num">${pct(catTot[sel]/months.reduce((a,m)=>a+M[m].total,0))}</span></div></div></section>`;

  // cambios este mes vs media
  const ch = prev.length ? cats.map(k=>{ const avgP=prev.reduce((a,m)=>a+(M[m].cats[k]||0),0)/prev.length; const now=M[mes].cats[k]||0; return {k,now,avgP,d:now-avgP} }).filter(x=>Math.abs(x.d)>=1).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8) : [];
  const cambios=`<section class="panel"><header><h2>${esc(cap(fmtMes(mes)))} frente a la media</h2><small class="muted">de ${prev.length} mes${prev.length===1?'':'es'} anterior${prev.length===1?'':'es'}</small></header>
    ${ch.length?`<div class="delta">${ch.map(x=>`<span class="l">${esc(catInfo(x.k).icono)} ${esc(catInfo(x.k).nombre)}</span><span class="num muted">${nf0.format(x.now)} / ${nf0.format(x.avgP)}</span><span class="num ${x.d>0?'up':'down'}">${x.d>0?'▲ +':'▼ −'}${eur(Math.abs(x.d),false)}</span>`).join('')}</div>
      <p class="muted" style="margin:10px 0 0"><small>Este mes / media. Si el mes está en curso, lo normal es que salga por debajo.</small></p>`:'<div class="empty">Hace falta al menos un mes anterior con gastos para comparar.</div>'}</section>`;

  // fijos vs variables y por persona
  const P={}; S.quien.forEach(r=>{ P[r.quien]=P[r.quien]||{tot:0,mes:0}; P[r.quien].tot+= +r.total; if(r.mes===mes) P[r.quien].mes+= +r.total });
  const pers=Object.entries(P).sort((a,b)=>b[1].tot-a[1].tot);
  const fv=`<section class="panel"><header><h2>Fijos, variables e ingresos</h2></header><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Fijos</th><th class="r">Variables</th><th class="r">Ahorro</th></tr></thead><tbody>
    ${months.slice().reverse().map(m=>{ const ing=ING[m]||0, ah=ing-M[m].total; return `<tr><td>${esc(cap(fmtMes(m)))}</td><td class="r num">${nf0.format(ing)}</td><td class="r num">${nf0.format(M[m].fijo)}</td><td class="r num">${nf0.format(M[m].var)}</td><td class="r num ${ing? (ah>=0?'pos':'neg'):''}">${ing?pct(ah/ing):'—'}</td></tr>`}).join('')}
    </tbody></table></div><p class="muted" style="margin:8px 0 0"><small>«Ahorro» es lo que sobra de los ingresos después de los gastos.</small></p></section>`;
  const per=`<section class="panel"><header><h2>Variables por persona</h2><small class="muted">quién lo apuntó</small></header>${pers.length?`<div class="ledger">${pers.map(([q,v])=>`<div class="row"><span>${esc(q)}</span><span class="num">${eur(v.tot,false)} <small class="muted">· este mes ${eur(v.mes,false)}</small></span></div>`).join('')}</div>`:'<div class="empty">Sin datos.</div>'}</section>`;

  return head+kpis+`<div class="grid two">${'<div class="stack">'+chart+heat+'</div>'}${'<div class="stack">'+detalle+cambios+fv+per+'</div>'}</div>`;
}

let Q = {cat:'', texto:'', periodo:'mes', res:null, key:''};
function movsActivo(){ return !!(Q.cat || Q.texto.trim() || Q.periodo!=='mes') }
function vMovs(){
  const tipos = [['todos','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['ahorro','Ahorro'],['inversion','Inversión'],['retirada','Retiradas']];
  const opt = t => D.categorias.filter(c=>c.tipo===t).map(c=>`<option value="${c.id}" ${Q.cat===c.id?'selected':''}>${esc(c.icono)} ${esc(c.nombre)}${c.activa?'':' (inactiva)'}</option>`).join('');
  return `<section class="panel" style="margin-top:16px">
    <div class="search">
      <div class="field grow"><label for="qTexto">Buscar</label><input id="qTexto" type="search" placeholder="coche, Mercadona, regalo…" value="${esc(Q.texto)}" autocomplete="off"></div>
      <div class="field"><label for="qCat">Categoría</label><select id="qCat"><option value="">Todas</option><optgroup label="Gastos">${opt('gasto')}</optgroup><optgroup label="Ingresos">${opt('ingreso')}</optgroup></select></div>
      <div class="field"><label for="qPer">Periodo</label><select id="qPer">${[['mes',cap(fmtMes(mes))],['3','Últimos 3 meses'],['6','Últimos 6 meses'],['12','Últimos 12 meses'],['todo','Desde el principio']].map(([k,l])=>`<option value="${k}" ${Q.periodo===k?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    </div>
    <div class="filters" style="margin:12px 0 4px">${tipos.map(([k,l])=>`<button class="chip" aria-pressed="${movFilter===k}" onclick="movFilter='${k}';Q.key='';movsRefresh();this.parentNode.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===this))">${l}</button>`).join('')}</div>
    <div id="movRes"></div>
  </section>`;
}
function movsBind(){
  const t=$('#qTexto'), c=$('#qCat'), p=$('#qPer'); if(!t) return;
  let tm; t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ Q.texto=t.value; movsRefresh() },350) };
  c.onchange=()=>{ Q.cat=c.value; movsRefresh() };
  p.onchange=()=>{ Q.periodo=p.value; movsRefresh() };
}
function listaAgrupada(M, porMes){
  let html='', last='';
  M.forEach(m=>{
    const k = porMes ? m.fecha.slice(0,7) : m.fecha;
    if(k!==last){ last=k;
      if(porMes){ const sub=M.filter(x=>x.fecha.startsWith(k)); const g=sub.filter(x=>x.tipo==='gasto').reduce((a,x)=>a+ +x.importe,0);
        html+=`<div class="day month-h"><span>${esc(cap(fmtMes(k)))}</span><span class="num">${sub.length} · ${g?eur(g):''}</span></div>` }
      else { const d=new Date(m.fecha+'T12:00'); html+=`<div class="day">${cap(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</div>` }
    }
    html += itemHtml(m);
  });
  return html;
}
async function movsRefresh(){
  const box=$('#movRes'); if(!box) return;
  const filtroTipo = m => movFilter==='todos' || m.tipo===movFilter;
  if(!movsActivo()){
    const M=D.movimientos.filter(filtroTipo); const tot=M.reduce((a,m)=>a+ +m.importe,0);
    box.innerHTML = `<p class="muted" style="margin:6px 0"><small>${M.length} movimiento${M.length===1?'':'s'} en ${esc(fmtMes(mes))}${movFilter!=='todos'?' · '+eur(tot):''}</small></p>
      <div class="list">${listaAgrupada(M,false) || '<div class="empty">No hay movimientos en '+esc(fmtMes(mes))+'.</div>'}</div>`;
    return;
  }
  const [ini,fin]=ymRange(mes);
  const desde = Q.periodo==='mes' ? ini : Q.periodo==='todo' ? null : ymAdd(ymNow(),-(+Q.periodo-1))+'-01';
  const key = [Q.cat,Q.texto.trim(),Q.periodo,mes,movFilter].join('|');
  if(Q.key!==key){
    box.innerHTML='<p class="muted"><small>Buscando…</small></p>';
    try{ Q.res = await rpc('buscar',{p_categoria:Q.cat||null,p_texto:Q.texto.trim()||null,p_desde:desde,p_tipo:movFilter==='todos'?null:movFilter}); Q.key=key }
    catch(e){ box.innerHTML=`<p class="err">${esc(e.message)}</p>`; return }
  }
  let M = Q.res; if(Q.periodo==='mes') M=M.filter(m=>m.fecha<=fin);
  const gastos=M.filter(m=>m.tipo==='gasto'), ingresos=M.filter(m=>m.tipo==='ingreso');
  const tg=gastos.reduce((a,m)=>a+ +m.importe,0), ti=ingresos.reduce((a,m)=>a+ +m.importe,0);
  const meses=new Set(M.map(m=>m.fecha.slice(0,7))).size;
  const nMeses = Q.periodo==='mes'?1 : Q.periodo==='todo'? Math.max(1,meses) : +Q.periodo;
  const cat=D.catById[Q.cat];
  const titulo=[cat?esc(cat.icono)+' '+esc(cat.nombre):'', Q.texto.trim()?'«'+esc(Q.texto.trim())+'»':''].filter(Boolean).join(' · ')||'Todos los movimientos';
  box.innerHTML = `<div class="sres"><div><b>${titulo}</b><br><small class="muted">${M.length} movimiento${M.length===1?'':'s'}${M.length>=1000?' (se muestran los 1000 más recientes)':''}</small></div>
      <button class="btn small" onclick="Q={cat:'',texto:'',periodo:'mes',res:null,key:''};render()">Limpiar</button></div>
    ${M.length?`<div class="ledger" style="margin:6px 0 4px">
      ${tg?`<div class="row"><span>Total gastado</span><span class="num">${eur(tg)}</span></div><div class="row"><span>Media al mes${Q.periodo==='todo'?' (meses con gasto)':''}</span><span class="num">${eur(tg/nMeses)}</span></div>`:''}
      ${ti?`<div class="row"><span>Total ingresado</span><span class="num">${eur(ti)}</span></div>`:''}
    </div>`:''}
    <div class="list">${listaAgrupada(M, Q.periodo!=='mes') || '<div class="empty">No hay movimientos que coincidan. Prueba con otra palabra o un periodo más largo.</div>'}</div>`;
}
function itemHtml(m){
  const c = D.catById[m.categoria_id]; const p = D.posById[m.posicion_id];
  const titulo = m.tipo==='retirada' ? 'Retirada'+(p?' de '+p.nombre:'') : m.tipo==='ahorro'||m.tipo==='inversion' ? (p?p.nombre:(m.tipo==='ahorro'?'Ahorro':'Inversión')) : (c?c.nombre:'Sin categoría');
  const icono = m.tipo==='ahorro'?'🐷':m.tipo==='inversion'?'📈':m.tipo==='retirada'?'↩️':(c?c.icono:'•');
  const meta = [m.nota, m.quien, m.origen==='iphone'?'iPhone':m.origen==='fijos'?'fijo':null].filter(Boolean).map(esc).join(' · ');
  const signo = m.tipo==='gasto'?'−':m.tipo==='ingreso'?'+':m.tipo==='retirada'?'← ':'→ ';
  return `<button class="item" onclick="editar('${m.id}')"><span class="ico">${esc(icono)}</span><span class="t"><div>${esc(titulo)}</div>${meta?`<small>${meta}</small>`:''}</span><span class="amt ${m.tipo}">${signo}${eur(m.importe)}</span></button>`;
}

function vFijos(){
  const f = D.fijos;
  const tabla = (tipo)=>{
    const rows = f.filter(x=>x.tipo===tipo);
    if(!rows.length) return `<div class="empty">Ningún ${tipo} fijo todavía.</div>`;
    const tot = rows.filter(x=>x.activo).reduce((a,x)=>a+x.importe/x.cada_meses,0);
    return `<div class="scroll"><table class="tbl"><thead><tr><th>Concepto</th><th>Cada</th><th class="r">Importe</th><th class="r">Al mes</th></tr></thead><tbody>

      <tr><td colspan="3"><b>Total al mes</b></td><td class="r num"><b>${eur(tot)}</b></td></tr></tbody></table></div>`;
  };
  return `<div class="grid two">
    <section class="panel"><header><h2>Gastos fijos</h2><button class="btn small primary" onclick="editFijo(null,'gasto')">Añadir gasto fijo</button></header>${tabla('gasto')}

    <section class="panel"><header><h2>Ingresos fijos</h2><button class="btn small primary" onclick="editFijo(null,'ingreso')">Añadir ingreso fijo</button></header>${tabla('ingreso')}

  </div>`;
}
function periodoTxt(x){ return {1:'mes',2:'2 meses',3:'trimestre',4:'4 meses',6:'semestre',12:'año'}[x.cada_meses] + (x.cada_meses>1?` <small class="muted">desde ${new Date(2000,x.mes_inicio-1,1).toLocaleDateString('es-ES',{month:'short'})}</small>`:'') }

const TIPOS_POS = {liquidez:'Liquidez y colchón',fondo:'Fondos',acciones:'Acciones',cripto:'Criptomonedas',proyecto:'Proyectos',inmobiliario:'Inmobiliario',otro:'Otros'};
function vPatri(){
  const P = D.posiciones.filter(p=>p.activa);
  const total = P.reduce((a,p)=>a+ +p.valor_actual,0);
  const aport = P.reduce((a,p)=>a+ +p.aportado,0);
  const liq = P.filter(p=>p.tipo==='liquidez').reduce((a,p)=>a+ +p.valor_actual,0);
  const inv = total-liq;
  const invAport = P.filter(p=>p.tipo!=='liquidez').reduce((a,p)=>a+ +p.aportado,0);
  const rent = inv-invAport;
  const grupos = Object.keys(TIPOS_POS).map(t=>{
    const rows=P.filter(p=>p.tipo===t); if(!rows.length) return '';
    return `<tr><td colspan="4" class="eyebrow" style="padding-top:16px">${TIPOS_POS[t]}</td></tr>`+rows.map(p=>{
      const g=p.valor_actual-p.aportado; const gp = p.aportado>0? g/p.aportado : 0;
      return `<tr class="click" onclick="editPos('${p.id}')"><td>${esc(p.nombre)}<br><small class="muted">valor a ${new Date(p.fecha_valor+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}</small></td><td class="r num hide-sm">${eur(p.aportado)}</td><td class="r num">${eur(p.valor_actual)}</td><td class="r num ${t==='liquidez'?'':g>=0?'pos':'neg'}">${t==='liquidez'?'—':sgn(g)+'<br><small>'+pct(gp)+'</small>'}</td></tr>`}).join('');
  }).join('');
  const share = total>0 ? Object.keys(TIPOS_POS).map(t=>[t,P.filter(p=>p.tipo===t).reduce((a,p)=>a+ +p.valor_actual,0)]).filter(x=>x[1]>0) : [];
  const colors = {liquidez:'var(--ahorro)',fondo:'var(--inv)',acciones:'var(--c2)',cripto:'var(--c6)',proyecto:'var(--accent)',inmobiliario:'var(--warn)',otro:'var(--muted)'};
  return `<div class="grid two">
    <section class="panel">
      <header><h2>Posiciones</h2><button class="btn small primary" onclick="editPos(null)">Añadir</button></header>
      ${P.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Nombre</th><th class="r hide-sm">Aportado</th><th class="r">Valor</th><th class="r">Resultado</th></tr></thead><tbody>${grupos}</tbody></table></div>`:'<div class="empty">Añade vuestras cuentas de ahorro, fondos o proyectos.</div>'}
      <p class="muted"><small>Cuando movéis dinero a ahorro o inversión, la posición sube sola. Actualizad el valor de los fondos cuando queráis (por ejemplo, una vez al mes) tocando la fila.</small></p>
    </section>
    <div class="stack">
      <section class="panel">
        <header><h2>Patrimonio</h2></header>
        <div class="big num" style="font-size:2rem;font-family:var(--f-num)">${eur(total)}</div>
        ${share.length?`<div class="meter" style="display:flex;height:12px">${share.map(([t,v])=>`<i style="width:${(v/total*100).toFixed(1)}%;background:${colors[t]};border-radius:0"></i>`).join('')}</div>
        <div class="legend">${share.map(([t,v])=>`<span><i class="dot" style="background:${colors[t]}"></i>${TIPOS_POS[t]} ${pct(v/total)}</span>`).join('')}</div>`:''}
        <div class="ledger" style="margin-top:10px">
          <div class="row"><span>Liquidez</span><span class="num">${eur(liq)}</span></div>
          <div class="row"><span>Invertido (valor)</span><span class="num">${eur(inv)}</span></div>
          <div class="row"><span>Aportado a inversión</span><span class="num">${eur(invAport)}</span></div>
          <div class="row total"><span>Resultado de la inversión</span><span class="num ${rent>=0?'pos':'neg'}">${sgn(rent)} <small>${invAport>0?pct(rent/invAport):''}</small></span></div>
        </div>
      </section>
      <section class="panel">
        <header><h2>Aportado este año</h2></header>
        ${aportadoAnio()}
      </section>
    </div>
  </div>`;
}
function aportadoAnio(){
  const y = ymNow().slice(0,4);
  const H = D.historico.filter(h=>h.mes.startsWith(y));
  const a = H.reduce((s,h)=>s+ +h.ahorro,0), i = H.reduce((s,h)=>s+ +h.inversion,0), ret = H.reduce((s,h)=>s+ +(h.retirada||0),0), ing=H.reduce((s,h)=>s+ +h.ingresos,0);
  return `<div class="ledger"><div class="row"><span><i class="dot" style="background:var(--ahorro)"></i>A ahorro</span><span class="num">${eur(a)}</span></div>
    <div class="row"><span><i class="dot" style="background:var(--inv)"></i>A inversión</span><span class="num">${eur(i)}</span></div>
    ${ret?`<div class="row"><span><i class="dot" style="background:var(--warn)"></i>Retirado</span><span class="num">−${eur(ret)}</span></div>`:''}
    <div class="row total"><span>Tasa de ahorro ${y}</span><span class="num">${ing>0?pct((a+i-ret)/ing):'—'}</span></div></div>`;
}

let F = null; // estado del formulario de movimiento

function posDe(tipo){ return D.posiciones.filter(p=>p.activa && (tipo==='retirada' ? true : tipo==='ahorro'? p.tipo==='liquidez' : p.tipo!=='liquidez')).sort((a,b)=>(a.tipo==='liquidez'?0:1)-(b.tipo==='liquidez'?0:1)) }

function sheetMov(){
  const t=F.tipo;
  const cats = D.categorias.filter(c=>c.activa && c.tipo===(t==='ingreso'?'ingreso':'gasto')).sort((a,b)=>(a.naturaleza==='variable'?0:1)-(b.naturaleza==='variable'?0:1));
  const P = posDe(t);
  const selector = (t==='gasto'||t==='ingreso')
    ? `<div class="field"><label>Categoría</label><div class="catgrid">${cats.map(c=>`<button type="button" aria-pressed="${F.categoria_id===c.id}" onclick="F.categoria_id='${c.id}';sync();sheetMov()"><span>${esc(c.icono)}</span>${esc(c.nombre)}</button>`).join('')}</div></div>`
    : `<div class="field"><label for="fPos">${t==='ahorro'?'Cuenta de ahorro':t==='retirada'?'¿De dónde sale el dinero?':'Dónde se invierte'}</label>${P.length?`<select id="fPos">${P.map(p=>`<option value="${p.id}" ${F.posicion_id===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>${t==='retirada'?'<small class="muted">Úsalo cuando paséis dinero de ahorros o inversiones a la cuenta del día a día. Resta de esa cuenta y cubre lo que falte este mes.</small>':''}`:`<p class="muted" style="margin:0">No hay ${t==='ahorro'||t==='retirada'?'cuentas de liquidez':'posiciones de inversión'}. <button type="button" class="btn small" onclick="closeSheet();setTab('patri');editPos(null,'${t==='ahorro'?'liquidez':'fondo'}')">Crear una</button></p>`}</div>`;
  openSheet(`<h3>${F.id?'Editar movimiento':'Apuntar'}</h3>
  <form class="form" onsubmit="event.preventDefault();guardarMov()">
    <div class="seg cinco" role="group" aria-label="Tipo">${[['gasto','Gasto'],['ingreso','Ingreso'],['ahorro','Ahorro'],['inversion','Inversión'],['retirada','Retirar']].map(([k,l])=>`<button type="button" aria-pressed="${t===k}" onclick="sync();F.tipo='${k}';F.categoria_id=null;F.posicion_id=${(k==='ahorro'||k==='inversion'||k==='retirada')?`defaultPos('${k}')`:'null'};F.aviso=null;sheetMov()">${l}</button>`).join('')}</div>
    <div class="field"><label for="fImp">Importe (€)</label><input id="fImp" class="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(F.importe)}" ${F.id?'':'autofocus'} required>${(t==='ahorro'||t==='inversion')?`<small class="muted">Disponible por repartir en ${esc(fmtMes(mes))}: <b>${eur(Math.max(0,calc().porAsignar+(F.id&&(F.tipo==='ahorro'||F.tipo==='inversion')?(+(D.movimientos.find(m=>m.id===F.id)||{}).importe||0):0)))}</b></small>`:''}</div>

    <div class="field"><label for="fFecha">Fecha</label><div class="datebox"><input id="fFecha" type="date" value="${esc(F.fecha)}" required></div></div>

    <div id="fErr" class="err" hidden></div>

    ${F.confirm?`<div class="confirm"><span>¿Borrar este movimiento?</span><button type="button" class="btn small danger" onclick="anular()">Sí, borrar</button><button type="button" class="btn small" onclick="F.confirm=false;sync();sheetMov()">No</button></div>`:''}
    <div class="actions">${F.id&&!F.confirm?`<button type="button" class="btn danger left" onclick="sync();F.confirm=true;sheetMov()">Borrar</button>`:''}<button type="button" class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>

function sync(){ // guarda lo escrito antes de re-dibujar la hoja
  const g=id=>document.getElementById(id);
  if(g('fImp')) F.importe=g('fImp').value; if(g('fFecha')) F.fecha=g('fFecha').value;
  if(g('fNota')) F.nota=g('fNota').value; if(g('fQuien')) F.quien=g('fQuien').value;
  if(g('fPos')) F.posicion_id=g('fPos').value; if(g('fFijo')) F.fijo=g('fFijo').checked;
}
function fErr(msg){ const e=$('#fErr'); e.textContent=msg; e.hidden=false }
async function guardarMov(){
  sync();
  const imp = parseNum(F.importe);
  if(!(imp>0)) return fErr('Escribe un importe mayor que cero.');
  if((F.tipo==='gasto'||F.tipo==='ingreso') && !F.categoria_id) return fErr('Elige una categoría.');
  if((F.tipo==='ahorro'||F.tipo==='inversion'||F.tipo==='retirada') && !F.posicion_id) return fErr(F.tipo==='retirada'?'Elige de dónde sale el dinero.':'Elige dónde va el dinero.');
  if((F.tipo==='ahorro'||F.tipo==='inversion') && !F.forzar && F.fecha.slice(0,7)===mes){
    const previo = F.id ? (D.movimientos.find(m=>m.id===F.id)||{}) : {};
    const disp = calc().porAsignar + ((previo.tipo==='ahorro'||previo.tipo==='inversion') ? +previo.importe : 0);
    if(imp > Math.max(0,disp)+0.005){
      F.aviso = disp>0 ? `Este mes solo quedan <b>${eur(disp)}</b> por repartir y vas a mover <b>${eur(imp)}</b>. Si el dinero sale de ahorros de otros meses, puedes guardarlo igualmente.`
                       : `Este mes no queda nada por repartir (ingresos menos gastos). Si el dinero sale de ahorros de otros meses, puedes guardarlo igualmente.`;
      return sheetMov();
    }
  }
  if(F.tipo==='retirada' && !F.forzar){ const p=D.posById[F.posicion_id]; const previo=F.id?(D.movimientos.find(m=>m.id===F.id)||{}):{}; const saldo=(+p?.valor_actual||0)+(previo.tipo==='retirada'&&previo.posicion_id===F.posicion_id?+previo.importe:0);
    if(p && imp>saldo+0.005){ F.aviso=`En «${esc(p.nombre)}» solo constan <b>${eur(saldo)}</b> y vas a sacar <b>${eur(imp)}</b>. Revisa el importe o actualiza antes el saldo en Patrimonio.`; return sheetMov() } }
  const cat = D.catById[F.categoria_id];
  const fila = {tipo:F.tipo, importe:Math.round(imp*100)/100, fecha:F.fecha, nota:F.nota.trim()||null, quien:(F.quien||'').trim()||null,
    categoria_id:(F.tipo==='gasto'||F.tipo==='ingreso')?F.categoria_id:null,
    posicion_id:(F.tipo==='ahorro'||F.tipo==='inversion'||F.tipo==='retirada')?F.posicion_id:null,
    fijo: F.tipo==='gasto' ? (F.fijo ?? (cat?.naturaleza==='fijo')) : false};
  if(F.id) fila.id=F.id;
  if(!F.id && F.tipo==='gasto' && document.getElementById('fFijo')==null) fila.fijo = cat?.naturaleza==='fijo';
  try{ await rpc('guardar',{p_tabla:'movimientos',p_fila:fila}); closeSheet(); toast(F.id?'Movimiento actualizado':'Apuntado: '+eur(fila.importe));
    const ym=F.fecha.slice(0,7); if(ym!==mes){ mes=ym } await load() }
  catch(e){ fErr(e.message) }
}
async function anular(){ try{ await rpc('anular',{p_id:F.id}); closeSheet(); toast('Movimiento borrado'); await load() }catch(e){ fErr(e.message) } }

}
async function registrarFijos(){
  try{ const n = await rpc('registrar_fijos',{p_mes:mes+'-01'}); toast(n? `${n} fijo${n>1?'s':''} registrado${n>1?'s':''}` : 'No había fijos nuevos que registrar'); await load() }catch(e){ toast(e.message) }
}

/* posiciones */
function editPos(id,tipoDef='fondo'){
  const p = id ? D.posById[id] : {nombre:'',tipo:tipoDef,aportado:'',valor_actual:'',notas:'',activa:true,fecha_valor:todayISO()};
  openSheet(`<h3>${id?esc(p.nombre):'Nueva posición'}</h3>
  <form class="form" onsubmit="event.preventDefault();guardarPos('${id||''}')">
    <div class="field"><label for="pN">Nombre</label><input id="pN" value="${esc(p.nombre)}" placeholder="Indexa, MSCI World, Apple, Bitcoin, cuenta remunerada…" required ${id?'':'autofocus'}></div>
    <div class="field"><label for="pT">Tipo</label><select id="pT">${Object.entries(TIPOS_POS).map(([k,l])=>`<option value="${k}" ${p.tipo===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label for="pA">Aportado (€)</label><input id="pA" inputmode="decimal" value="${p.aportado===''?'':nf.format(p.aportado).replace(/\./g,'')}" placeholder="0,00"></div>
    <div class="field"><label for="pV">Valor actual (€)</label><input id="pV" inputmode="decimal" value="${p.valor_actual===''?'':nf.format(p.valor_actual).replace(/\./g,'')}" placeholder="0,00"></div></div>
    ${id?'<p class="muted" style="margin:0"><small>Las aportaciones que apuntéis se suman solas. Aquí cambia sobre todo el valor actual.</small></p>':''}
    <div class="field"><label for="pNo">Notas</label><input id="pNo" value="${esc(p.notas||'')}" placeholder="Broker, ISIN, condiciones…"></div>
    ${id?`<label class="check"><input type="checkbox" id="pAc" ${p.activa?'':'checked'}> Archivar (ya no la tenemos)</label>`:''}
    <div id="fErr" class="err" hidden></div>
    <div class="actions">${id?`<button type="button" class="btn left" onclick="closeSheet();nuevo('${p.tipo==='liquidez'?'ahorro':'inversion'}');F.posicion_id='${id}';sheetMov()">Aportar</button>`:''}<button type="button" class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
  </form>`);
}
async function guardarPos(id){
  const a=parseNum(pA.value||'0'), v=parseNum(pV.value||(pA.value||'0'));
  if(!(a>=0)||!(v>=0)) return fErr('Revisa los importes.');
  const fila={nombre:pN.value.trim(),tipo:pT.value,aportado:Math.round(a*100)/100,valor_actual:Math.round(v*100)/100,notas:pNo.value.trim()||null,fecha_valor:todayISO()};
  if(id){ fila.id=id; fila.activa=!document.getElementById('pAc').checked }
  try{ await rpc('guardar',{p_tabla:'posiciones',p_fila:fila}); closeSheet(); toast('Guardado'); await load() }catch(e){ fErr(e.message) }
}

/* categorías */
function editCat(id){
  const c = id ? D.catById[id] : {nombre:'',tipo:'gasto',naturaleza:'variable',icono:'',presupuesto:null,activa:true,orden:50};
  openSheet(`<h3>${id?'Editar':'Nueva'} categoría</h3>
  <form class="form" onsubmit="event.preventDefault();guardarCat('${id||''}')">
    <div class="row2" style="grid-template-columns:80px 1fr"><div class="field"><label for="cI">Icono</label><input id="cI" value="${esc(c.icono)}" maxlength="4" placeholder="🙂" style="text-align:center"></div>
    <div class="field"><label for="cN">Nombre</label><input id="cN" value="${esc(c.nombre)}" required ${id?'':'autofocus'}></div></div>
    <div class="row2"><div class="field"><label for="cT">Es de</label><select id="cT" ${id?'disabled':''}><option value="gasto" ${c.tipo==='gasto'?'selected':''}>Gasto</option><option value="ingreso" ${c.tipo==='ingreso'?'selected':''}>Ingreso</option></select></div>
    <div class="field"><label for="cNat">Naturaleza</label><select id="cNat"><option value="variable" ${c.naturaleza==='variable'?'selected':''}>Variable</option><option value="fijo" ${c.naturaleza==='fijo'?'selected':''}>Fijo</option></select></div></div>
    <div class="field"><label for="cP">Presupuesto mensual (€, opcional)</label><input id="cP" inputmode="decimal" value="${c.presupuesto?nf.format(c.presupuesto).replace(/\./g,''):''}" placeholder="Sin presupuesto"></div>
    <label class="check"><input type="checkbox" id="cA" ${c.activa?'checked':''}> Activa</label>
    <div id="fErr" class="err" hidden></div>
    <div class="actions"><button type="button" class="btn" onclick="closeSheet()">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
  </form>`);
}
async function guardarCat(id){
  const p = cP.value.trim()? parseNum(cP.value) : null;
  const fila={nombre:cN.value.trim(),icono:cI.value.trim()||'•',naturaleza:cNat.value,presupuesto:p,activa:cA.checked};
  if(id) fila.id=id; else { fila.tipo=cT.value; fila.orden=50 }
  try{ await rpc('guardar',{p_tabla:'categorias',p_fila:fila}); closeSheet(); toast('Guardado'); await load() }catch(e){ fErr(e.message.includes('duplicate')?'Ya existe una categoría con ese nombre.':e.message) }
}
async function guardarAjustes(){
  try{ await rpc('guardar_ajustes',{p_pct_ahorro:+pctA.value,p_colchon_meses:+colM.value||0}); toast('Ajustes guardados'); await load() }catch(e){ toast(e.message) }
}

/* ---------- navegación y acceso ---------- */
function setTab(t){ tab=t; store.set('tab',t); render(); $('#view').scrollTop=0 }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#prevM').onclick=()=>{ mes=ymAdd(mes,-1); load() };
$('#nextM').onclick=()=>{ mes=ymAdd(mes,1); load() };
$('#fab').onclick=()=>nuevo('gasto');
$('#gearBtn').onclick=()=>setTab(tab==='ajustes'?'resumen':'ajustes');

function showApp(){ $('#login').hidden=true; $('#app').hidden=false; $('#fab').hidden=false; load() }
function logout(msg){ TOKEN=null; store.set('token',null); D=null; $('#app').hidden=true; $('#fab').hidden=true; $('#login').hidden=false; $('#who').value=WHO; const e=$('#loginErr'); e.hidden=!msg; e.textContent=msg||'' }
$('#loginForm').onsubmit = async ev=>{
  ev.preventDefault(); TOKEN=$('#code').value.trim(); WHO=$('#who').value.trim();
  try{ await rpc('categorias_lista',{p_tipo:'gasto'}); store.set('token',TOKEN); store.set('who',WHO); showApp() }
  catch(e){ logout(e.code==='28000'?'Ese código no es correcto.':'No se ha podido conectar: '+e.message) }
};
let abrirApuntar = location.hash==='#apuntar';
if(abrirApuntar) history.replaceState(null,'',location.pathname);
if(TOKEN){ showApp() } else logout();
window.addEventListener('hashchange',()=>{ if(location.hash!=='#apuntar') return; history.replaceState(null,'',location.pathname); if(D && TOKEN) nuevo('gasto'); else abrirApuntar=true });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && TOKEN && D) load() });
/* ---------- actualización automática ---------- */
async function buscarVersion(){
  try{
    const r = await fetch(location.pathname+'?v='+Date.now(), {cache:'no-store'});
    const t = await r.text(); const m = t.match(/const VERSION = '([^']+)'/);
    if(m && m[1]!==VERSION){
      if(dlg.open) return;               // no recargar si hay un formulario abierto
      let ya=null; try{ ya=sessionStorage.getItem('cc_upd') }catch(e){}
      if(ya===m[1]) return;              // ya lo intentamos con esta versión: no insistir
      try{ sessionStorage.setItem('cc_upd', m[1]) }catch(e){}
      toast('Actualizando a la nueva versión…');
      setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])), 600);   // la URL nueva salta el caché
    }
  }catch(e){}
}
buscarVersion();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) buscarVersion() });
